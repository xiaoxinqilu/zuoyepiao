name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on:  steps:
      - uses: actions/checkout@v4
      
      - name: Build with Buildozer Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/home/user/hostcwd kivy/buildozer:latest android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
         Zhuye
         path: bin/*.apk
